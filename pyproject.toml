[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paidanswer"
version = "0.1.0"
description = "Pay-per-answer AI chatbot core for Telegram and WhatsApp, with tested refund guarantees."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.scripts]
paidanswer = "paidanswer.cli:main"

[tool.setuptools]
packages = ["paidanswer"]
